<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Feed</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #191919;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: #191919; }
  ::-webkit-scrollbar-thumb { background: #2a2725; border-radius: 2px; }
  * { scrollbar-width: thin; scrollbar-color: #2a2725 #191919; }

  .widget {
    width: 100%;
    background: #191919;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    padding: 1.5rem 2rem;
  }

  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #191919;
    padding-bottom: 0.5rem;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding-top: 0.25rem;
  }

  .header-label {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    color: #d0cbc5;
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #5a9e5a;
    animation: pulse 2s ease infinite;
  }

  .status-dot.stale { background: #b8843a; animation: pulse 3s ease infinite; }
  .status-dot.offline { background: #a05050; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .last-update {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    color: #6b6660;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .refresh-btn {
    font-size: 0.7rem;
    color: #5a5650;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s, transform 0.3s;
    margin-left: 0.4rem;
    display: inline-block;
  }
  .refresh-btn:hover { color: #a09a92; }
  .refresh-btn.spinning { animation: spin 0.8s linear; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .bot-status-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  .bot-status-bar.running {
    background: rgba(90, 158, 90, 0.06);
    border-color: rgba(90, 158, 90, 0.12);
  }

  .bot-status-bar.stale {
    background: rgba(184, 132, 58, 0.06);
    border-color: rgba(184, 132, 58, 0.12);
  }

  .bot-status-bar.down {
    background: rgba(160, 80, 80, 0.06);
    border-color: rgba(160, 80, 80, 0.12);
  }

  .bot-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .bot-status-dot.running { background: #5a9e5a; animation: pulse 2s ease infinite; }
  .bot-status-dot.stale { background: #b8843a; animation: pulse 3s ease infinite; }
  .bot-status-dot.down { background: #a05050; animation: none; }

  .bot-status-text {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 0.75rem;
    flex: 1;
  }

  .bot-status-text.running { color: #6ec07a; }
  .bot-status-text.stale { color: #c4a35a; }
  .bot-status-text.down { color: #c06e6e; }

  .bot-status-time {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.55rem;
    color: #6b6660;
  }

  .bot-log-toggle {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.55rem;
    color: #5a5650;
    cursor: pointer;
    user-select: none;
  }

  .bot-log-toggle:hover { color: #8a857e; }

  .bot-log {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .bot-log.open { max-height: 200px; }

  .bot-log-inner {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    font-size: 0.55rem;
    line-height: 1.5;
    color: #6b6660;
    padding: 0.4rem 0 0.4rem 0.75rem;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* Portfolio summary */
  .portfolio-bar {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.25rem;
    padding: 0.75rem 1rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 1rem;
    color: #f2efea;
  }

  .stat-value.positive { color: #6ec07a; }
  .stat-value.negative { color: #c06e6e; }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.65rem;
    color: #6b6660;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }

  .tab {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #6b6660;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s ease, border-color 0.2s ease;
    user-select: none;
  }

  .tab:hover { color: #a09a92; }
  .tab.active { color: #d0cbc5; border-bottom-color: #d0cbc5; }

  .tab .count {
    font-size: 0.55rem;
    color: #4a4640;
    margin-left: 0.3rem;
  }

  .tab.active .count { color: #7a756e; }

  /* Trade cards */
  .trade-list {
    display: flex;
    flex-direction: column;
  }

  .trade-card {
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    overflow: hidden;
  }

  .trade-card:last-child { border-bottom: none; }

  .trade-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.25rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .trade-header:hover { background: rgba(255, 255, 255, 0.02); margin: 0 -0.5rem; padding: 0.6rem 0.75rem; border-radius: 4px; }

  .trade-caret {
    flex-shrink: 0;
    width: 12px;
    height: 12px;
    color: #4a4640;
    transition: transform 0.2s ease, color 0.2s ease;
  }

  .trade-card.expanded .trade-caret {
    transform: rotate(90deg);
    color: #8a857e;
  }

  .trade-direction {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .trade-direction.yes {
    color: #6ec07a;
    background: rgba(110, 192, 122, 0.1);
  }

  .trade-direction.no {
    color: #c06e6e;
    background: rgba(192, 110, 110, 0.1);
  }

  .trade-question {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.88rem;
    color: #d0cbc5;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .trade-size {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    font-size: 0.75rem;
    color: #8a857e;
    flex-shrink: 0;
  }

  .trade-time {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.7rem;
    color: #5a5650;
    flex-shrink: 0;
  }

  .trade-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .trade-card.expanded .trade-body {
    max-height: 2000px;
  }

  .trade-body-inner {
    padding: 0.25rem 0.25rem 0.75rem 1.75rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem 1.5rem;
  }

  .detail {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .detail-label {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.65rem;
    color: #5a5650;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .detail-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    font-size: 0.85rem;
    color: #b0aba5;
  }

  .detail-value.edge-positive { color: #6ec07a; }
  .detail-value.edge-negative { color: #c06e6e; }

  .trade-reasoning {
    grid-column: 1 / -1;
    margin-top: 0.25rem;
  }

  .reasoning-text {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #8a857e;
  }

  /* States */
  .loading-state, .empty-state, .error-state {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.8rem;
    color: #6b6660;
    padding: 2rem 0;
    text-align: center;
  }

  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.04);
    margin: 0.5rem 0;
  }

  /* Phase badge */
  .phase-badge {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  .phase-badge.learning {
    color: #6ec07a;
    background: rgba(110, 192, 122, 0.1);
    border: 1px solid rgba(110, 192, 122, 0.2);
  }

  .phase-badge.validating {
    color: #c4a35a;
    background: rgba(196, 163, 90, 0.1);
    border: 1px solid rgba(196, 163, 90, 0.2);
  }

  .phase-badge.live_trading {
    color: #c06e6e;
    background: rgba(192, 110, 110, 0.1);
    border: 1px solid rgba(192, 110, 110, 0.2);
  }

  /* Learning progress bar */
  .learning-bar {
    margin-bottom: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  .learning-label {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    color: #8a857e;
    margin-bottom: 0.35rem;
    display: flex;
    justify-content: space-between;
  }

  .progress-track {
    height: 4px;
    background: #2a2725;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, #5a9e5a, #7eb8d0);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* Exposure bar */
  .exposure-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .exposure-item {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    color: #8a857e;
  }

  .exposure-item .val {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    color: #b0aba5;
  }

  /* Backtest card */
  .backtest-card {
    margin-bottom: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  .backtest-title {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.65rem;
    color: #6b6660;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.35rem;
  }

  .backtest-grid {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .backtest-stat .label {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    color: #5a5650;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .backtest-stat .value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    font-size: 0.85rem;
    color: #b0aba5;
  }

  .backtest-stat .value.good { color: #6ec07a; }
  .backtest-stat .value.bad { color: #c06e6e; }

  /* Resolution timeline */
  .timeline-section {
    margin-bottom: 0.75rem;
  }

  .timeline-title {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 0.65rem;
    color: #6b6660;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.35rem;
  }

  .timeline-items {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .timeline-item {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: #8a857e;
  }

  .timeline-item.soon {
    border-color: rgba(126, 184, 208, 0.3);
    color: #7eb8d0;
    background: rgba(126, 184, 208, 0.05);
  }

  .timeline-item .tl-count {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    margin-left: 0.3rem;
  }

  /* Strategy sections (multi-strategy view) */
  .strategy-sections {
    margin-bottom: 0.75rem;
  }

  .strategy-section {
    margin-bottom: 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 6px;
    overflow: hidden;
  }

  .strategy-section[data-accent="green"] { border-left: 2px solid rgba(110, 192, 122, 0.4); }
  .strategy-section[data-accent="amber"] { border-left: 2px solid rgba(196, 163, 90, 0.4); }
  .strategy-section[data-accent="blue"]  { border-left: 2px solid rgba(126, 184, 208, 0.4); }

  .strategy-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.02);
    transition: background 0.15s;
  }

  .strategy-header:hover { background: rgba(255, 255, 255, 0.04); }

  .strategy-caret {
    width: 10px;
    color: #5a5650;
    transition: transform 0.2s;
    flex-shrink: 0;
    font-size: 0.7rem;
  }

  .strategy-section.expanded .strategy-caret { transform: rotate(90deg); }

  .strategy-name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 1rem;
    color: #d0cbc5;
  }

  .strategy-section[data-accent="green"] .strategy-name { color: #6ec07a; }
  .strategy-section[data-accent="amber"] .strategy-name { color: #c4a35a; }
  .strategy-section[data-accent="blue"]  .strategy-name { color: #7eb8d0; }

  .strategy-version {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: #6b6660;
  }

  .strategy-label {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 0.6rem;
    color: #5a5650;
    flex: 1;
  }

  .strategy-pnl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
  }

  .strategy-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }

  .strategy-section.expanded .strategy-body {
    max-height: 5000px;
  }

  .strategy-body-inner {
    padding: 0.5rem 0.75rem 0.75rem;
  }

  .strategy-body-inner .portfolio-bar {
    margin-bottom: 0.75rem;
  }

  .strategy-body-inner .trade-list {
    margin-top: 0;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="sticky-top">
    <div class="header-row">
      <div class="header-label"><span id="strategyName">Parallax</span> <span style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:300;color:#8a857e;letter-spacing:0.04em" id="strategyVersion">v0.4</span></div>
      <div class="header-meta">
        <span class="phase-badge learning" id="phaseBadge">LEARNING</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:#7a756e;letter-spacing:0.06em" id="strategyIter">iter 4</span>
        <div class="status-dot" id="statusDot"></div>
        <div class="last-update" id="lastUpdate">Loading...</div>
        <span class="refresh-btn" id="refreshBtn" title="Refresh now">&#8635;</span>
      </div>
    </div>

    <div class="bot-status-bar down" id="botStatusBar">
      <div class="bot-status-dot down" id="botDot"></div>
      <span class="bot-status-text down" id="botText">Checking...</span>
      <span class="bot-status-time" id="botTime"></span>
      <span class="bot-log-toggle" id="botLogToggle">Logs</span>
    </div>
  </div>
  <div class="bot-log" id="botLog">
    <div class="bot-log-inner" id="botLogInner">No log data.</div>
  </div>

  <div class="learning-bar" id="learningBar" style="display:none">
    <div class="learning-label">
      <span id="learningText">Learning Progress</span>
      <span id="learningPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="learningFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Multi-strategy sections container (shown when strategies array present) -->
  <div id="strategySections" class="strategy-sections" style="display:none"></div>

  <!-- Single-strategy view (backward compat) -->
  <div id="singleStrategyView">
    <div class="portfolio-bar" id="portfolioBar">
      <div class="stat"><span class="stat-value" id="sBankroll">--</span><span class="stat-label">Bankroll</span></div>
      <div class="stat"><span class="stat-value" id="sDeployed">--</span><span class="stat-label">Deployed</span></div>
      <div class="stat"><span class="stat-value" id="sPositions">--</span><span class="stat-label">Open</span></div>
      <div class="stat"><span class="stat-value" id="sPnl">--</span><span class="stat-label">Total P&L</span></div>
      <div class="stat"><span class="stat-value" id="sDrawdown">--</span><span class="stat-label">Max DD</span></div>
      <div class="stat"><span class="stat-value positive" id="sPotential">--</span><span class="stat-label">Potential Profit</span></div>
      <div class="stat"><span class="stat-value" id="sExpected">--</span><span class="stat-label">Expected Profit</span></div>
      <div class="stat"><span class="stat-value" id="sEdge">--</span><span class="stat-label">Avg Edge</span></div>
    </div>

    <div class="exposure-row" id="exposureRow"></div>

    <div class="backtest-card" id="backtestCard" style="display:none">
      <div class="backtest-title">Backtest Results</div>
      <div class="backtest-grid" id="backtestGrid"></div>
    </div>

    <div class="timeline-section" id="timelineSection" style="display:none">
      <div class="timeline-title">Resolution Timeline</div>
      <div class="timeline-items" id="timelineItems"></div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="all">All</div>
      <div class="tab" data-tab="open">Open</div>
      <div class="tab" data-tab="resolved">Resolved</div>
      <div class="tab" data-tab="markets" style="font-style:italic;color:#7eb8d0;">Live Markets</div>
    </div>

    <div class="trade-list" id="tradeList">
      <div class="loading-state">Loading feed...</div>
    </div>
  </div>
</div>

<script>
const FEED_URL = 'https://kyledock11.github.io/trade-feed-widget/feed.json';
const REFRESH_INTERVAL = 15000; // 15 seconds

let feedData = null;
let activeTab = 'all';
let isMultiStrategy = false;

// Strategy accent colors
const STRATEGY_COLORS = {
  'Parallax': 'green',
  'Contrarian': 'amber',
  'Zeitgeist': 'blue'
};

function getStrategyAccent(name) {
  return STRATEGY_COLORS[name] || 'green';
}

// Refresh button
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await fetchFeed();
  btn.classList.remove('spinning');
});

// Tabs
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTab = tab.dataset.tab;
  renderTrades();
});

function relativeTime(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  const diffMin = Math.floor((now - then) / 60000);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay === 1) return 'yesterday';
  return `${diffDay}d ago`;
}

function formatMoney(val) {
  if (val === null || val === undefined) return '--';
  const num = parseFloat(val);
  if (isNaN(num)) return '--';
  return num >= 0 ? `M$${num.toFixed(2)}` : `-M$${Math.abs(num).toFixed(2)}`;
}

function formatPct(val) {
  if (val === null || val === undefined) return '--';
  return (parseFloat(val) * 100).toFixed(1) + '%';
}

function calcPotentialProfit(trade) {
  const size = parseFloat(trade.size) || 0;
  const price = parseFloat(trade.entry_price) || 0;
  if (price <= 0 || price >= 1) return 0;
  return (size / price) - size;
}

function calcExpectedProfit(trade) {
  const potential = calcPotentialProfit(trade);
  const prob = parseFloat(trade.estimated_probability) || 0;
  const size = parseFloat(trade.size) || 0;
  // EV = (prob * profit_if_win) - ((1 - prob) * amount_risked)
  return (prob * potential) - ((1 - prob) * size);
}

function updateStrategy(strategy) {
  if (!strategy) return;
  const nameEl = document.getElementById('strategyName');
  const verEl = document.getElementById('strategyVersion');
  const iterEl = document.getElementById('strategyIter');
  if (nameEl) nameEl.textContent = strategy.name || 'Parallax';
  if (verEl) verEl.textContent = 'v' + (strategy.version || '?');
  if (iterEl) {
    const iter = strategy.iteration || '?';
    const label = strategy.current ? strategy.current.name : '';
    iterEl.textContent = label ? `iter ${iter} — ${label}` : `iter ${iter}`;
  }
}

function updateBotStatus(botStatus) {
  const bar = document.getElementById('botStatusBar');
  const dot = document.getElementById('botDot');
  const text = document.getElementById('botText');
  const time = document.getElementById('botTime');
  const logInner = document.getElementById('botLogInner');

  if (!botStatus || !botStatus.last_heartbeat) {
    bar.className = 'bot-status-bar down';
    dot.className = 'bot-status-dot down';
    text.className = 'bot-status-text down';
    text.textContent = 'BOT OFFLINE';
    time.textContent = 'No heartbeat received';
    return;
  }

  const heartbeat = new Date(botStatus.last_heartbeat);
  const ageMs = Date.now() - heartbeat.getTime();
  const ageMin = Math.floor(ageMs / 60000);

  let status;
  if (ageMin < 15) {
    status = 'running';
    text.textContent = 'BOT RUNNING';
  } else if (ageMin < 60) {
    status = 'stale';
    text.textContent = 'BOT DELAYED';
  } else {
    status = 'down';
    text.textContent = 'BOT OFFLINE';
  }

  bar.className = `bot-status-bar ${status}`;
  dot.className = `bot-status-dot ${status}`;
  text.className = `bot-status-text ${status}`;
  time.textContent = `Heartbeat: ${relativeTime(botStatus.last_heartbeat)}`;

  if (botStatus.last_log_lines && botStatus.last_log_lines.length > 0) {
    logInner.textContent = botStatus.last_log_lines.join('\n');
  } else {
    logInner.textContent = 'No recent log entries.';
  }
}

function updatePortfolio(stats) {
  if (!stats) return;
  const portfolio = (feedData && feedData.portfolio) || {};
  document.getElementById('sBankroll').textContent = formatMoney(portfolio.bankroll || stats.bankroll);
  document.getElementById('sDeployed').textContent = formatMoney(portfolio.deployed || stats.deployed);

  const posEl = document.getElementById('sPositions');
  posEl.textContent = stats.open_positions || 0;

  const pnlEl = document.getElementById('sPnl');
  pnlEl.textContent = formatMoney(stats.total_pnl);
  pnlEl.className = 'stat-value' + (stats.total_pnl > 0 ? ' positive' : stats.total_pnl < 0 ? ' negative' : '');

  const ddEl = document.getElementById('sDrawdown');
  ddEl.textContent = formatPct(stats.max_drawdown);
  ddEl.className = 'stat-value' + (stats.max_drawdown > 0 ? ' negative' : '');

  if (feedData && feedData.trades) {
    const openTrades = feedData.trades.filter(t => t.status === 'filled');
    const totalPotential = openTrades.reduce((sum, t) => sum + calcPotentialProfit(t), 0);
    const potEl = document.getElementById('sPotential');
    potEl.textContent = formatMoney(totalPotential);

    const totalExpected = openTrades.reduce((sum, t) => sum + calcExpectedProfit(t), 0);
    const expEl = document.getElementById('sExpected');
    expEl.textContent = formatMoney(totalExpected);
    expEl.className = 'stat-value' + (totalExpected > 0 ? ' positive' : totalExpected < 0 ? ' negative' : '');
  }

  if (feedData && feedData.stats) {
    const edgeEl = document.getElementById('sEdge');
    const avgEdge = feedData.stats.avg_edge;
    edgeEl.textContent = avgEdge ? (avgEdge * 100).toFixed(1) + '%' : '--';
  }
}

function buildPortfolioBarHTML(portfolio, stats, trades, idPrefix) {
  const bankroll = formatMoney((portfolio && portfolio.bankroll) || (stats && stats.bankroll));
  const deployed = formatMoney((portfolio && portfolio.deployed) || (stats && stats.deployed));
  const positions = (stats && stats.open_positions) || 0;
  const totalPnl = (stats && stats.total_pnl) || 0;
  const pnlClass = totalPnl > 0 ? ' positive' : totalPnl < 0 ? ' negative' : '';
  const maxDD = stats && stats.max_drawdown;
  const ddClass = maxDD > 0 ? ' negative' : '';

  let potentialProfit = 0;
  let expectedProfit = 0;
  if (trades) {
    const openTrades = trades.filter(t => t.status === 'filled');
    potentialProfit = openTrades.reduce((sum, t) => sum + calcPotentialProfit(t), 0);
    expectedProfit = openTrades.reduce((sum, t) => sum + calcExpectedProfit(t), 0);
  }

  const avgEdge = stats && stats.avg_edge ? (stats.avg_edge * 100).toFixed(1) + '%' : '--';
  const expClass = expectedProfit > 0 ? ' positive' : expectedProfit < 0 ? ' negative' : '';

  return `
    <div class="portfolio-bar">
      <div class="stat"><span class="stat-value">${bankroll}</span><span class="stat-label">Bankroll</span></div>
      <div class="stat"><span class="stat-value">${deployed}</span><span class="stat-label">Deployed</span></div>
      <div class="stat"><span class="stat-value">${positions}</span><span class="stat-label">Open</span></div>
      <div class="stat"><span class="stat-value${pnlClass}">${formatMoney(totalPnl)}</span><span class="stat-label">Total P&L</span></div>
      <div class="stat"><span class="stat-value${ddClass}">${formatPct(maxDD)}</span><span class="stat-label">Max DD</span></div>
      <div class="stat"><span class="stat-value positive">${formatMoney(potentialProfit)}</span><span class="stat-label">Potential Profit</span></div>
      <div class="stat"><span class="stat-value${expClass}">${formatMoney(expectedProfit)}</span><span class="stat-label">Expected Profit</span></div>
      <div class="stat"><span class="stat-value">${avgEdge}</span><span class="stat-label">Avg Edge</span></div>
    </div>
  `;
}

          <div class="trade-body-inner">
            <div class="detail">

              <span class="detail-value">${formatPct(trade.kelly_fraction)}</span>

function renderMultiStrategy() {
  const container = document.getElementById('strategySections');
  const strategies = feedData.strategies;

  if (!strategies || strategies.length === 0) return;

  container.style.display = 'block';
  document.getElementById('singleStrategyView').style.display = 'none';

  let html = '';
  strategies.forEach((strat, idx) => {
    const accent = getStrategyAccent(strat.name);
    const expanded = idx === 0 ? 'expanded' : '';
    const totalPnl = strat.stats ? strat.stats.total_pnl : null;
    const pnlColor = totalPnl > 0 ? '#6ec07a' : totalPnl < 0 ? '#c06e6e' : '#8a857e';
    const pnlText = totalPnl !== null && totalPnl !== undefined ? formatMoney(totalPnl) : '';

    html += `
      <div class="strategy-section ${expanded}" data-accent="${accent}" data-strategy-idx="${idx}">
        <div class="strategy-header" onclick="toggleStrategy(this)">
          <span class="strategy-caret">&#9654;</span>
          <span class="strategy-name">${esc(strat.name)}</span>
          <span class="strategy-version">v${esc(strat.version || '?')}</span>
          <span class="strategy-label">— ${esc(strat.label || '')}</span>
          ${pnlText ? `<span class="strategy-pnl" style="color:${pnlColor}">${pnlText}</span>` : ''}
        </div>
        <div class="strategy-body">
          <div class="strategy-body-inner">
            ${buildPortfolioBarHTML(strat.portfolio, strat.stats, strat.trades, 'strat' + idx)}
            ${strat.exposure ? buildExposureHTML(strat.exposure) : ''}
            <div class="trade-list">
              ${buildTradeListHTML(strat.trades, strat.estimates || (feedData.estimates || null))}

          </div>
        </div>
      </div>

  });

  container.innerHTML = html;
}

function buildExposureHTML(exposure) {
  if (!exposure) return '';
  let html = '<div class="exposure-row">';

  html += `<span class="exposure-item">High Edge (≥10%): <span class="val">${exposure.high_edge_count || 0} trades (${formatMoney(exposure.high_edge_deployed)})</span></span>`;
  html += `<span class="exposure-item">Low Edge: <span class="val">${exposure.low_edge_count || 0} trades (${formatMoney(exposure.low_edge_deployed)})</span></span>`;

  if (exposure.by_direction) {
    const yes = exposure.by_direction.yes || {count:0,deployed:0};
    const no = exposure.by_direction.no || {count:0,deployed:0};
    html += `<span class="exposure-item">YES: <span class="val">${yes.count} (${formatMoney(yes.deployed)})</span></span>`;
    html += `<span class="exposure-item">NO: <span class="val">${no.count} (${formatMoney(no.deployed)})</span></span>`;
  }

  if (exposure.by_category) {
    const cats = Object.entries(exposure.by_category).sort((a,b) => b[1].deployed - a[1].deployed).slice(0, 4);
    cats.forEach(([cat, data]) => {
      html += `<span class="exposure-item">${cat}: <span class="val">${data.count} (${formatMoney(data.deployed)})</span></span>`;
    });
  }

  html += '</div>';
  return html;
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderMarkets() {
  const list = document.getElementById('tradeList');

  if (!feedData || !feedData.markets || feedData.markets.length === 0) {
    list.innerHTML = '<div class="empty-state">No market scans available. Run the bot to populate.</div>';
    return;
  }

  list.innerHTML = '';
  const caretSVG = '<svg class="trade-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="4.5 3 7.5 6 4.5 9"/></svg>';

  const seen = new Set();
  const unique = feedData.markets.filter(m => {
    if (seen.has(m.market_id)) return false;
    seen.add(m.market_id);
    return true;
  });

  unique.sort((a, b) => {
    const edgeA = a.est_prob ? Math.abs(a.est_prob - a.current_yes_price) : 0;
    const edgeB = b.est_prob ? Math.abs(b.est_prob - b.current_yes_price) : 0;
    return edgeB - edgeA;
  });

  unique.forEach(market => {
    const card = document.createElement('div');
    card.className = 'trade-card';

    const yesPrice = parseFloat(market.current_yes_price) || 0;
    const estProb = market.est_prob ? parseFloat(market.est_prob) : null;
    const edge = estProb !== null ? ((estProb - yesPrice) * 100).toFixed(1) : null;
    const edgeAbs = estProb !== null ? (Math.abs(estProb - yesPrice) * 100).toFixed(1) : null;
    const direction = estProb !== null ? (estProb > yesPrice ? 'YES' : 'NO') : '--';
    const dirClass = direction === 'YES' ? 'yes' : direction === 'NO' ? 'no' : '';

    card.innerHTML = `
      <div class="trade-header">
        ${caretSVG}
        ${edgeAbs ? `<span class="trade-direction ${dirClass}">${direction}</span>` : ''}
        <span class="trade-question">${esc(market.question || market.market_id)}</span>
        <span class="trade-size" style="color:#8a857e">${formatPct(yesPrice)}</span>
        ${edgeAbs ? `<span class="trade-size" style="color:${parseFloat(edgeAbs) > 5 ? '#6ec07a' : '#8a857e'}">${edgeAbs}% edge</span>` : ''}
        <span class="trade-time">${relativeTime(market.scanned_at)}</span>
      </div>
      <div class="trade-body">
        <div class="trade-body-inner">
          <div class="detail">
            <span class="detail-label">YES Price</span>
            <span class="detail-value">${formatPct(market.current_yes_price)}</span>
          </div>
          <div class="detail">
            <span class="detail-label">NO Price</span>
            <span class="detail-value">${formatPct(market.current_no_price)}</span>
          </div>
          ${estProb !== null ? `
          <div class="detail">
            <span class="detail-label">Bot Estimate</span>
            <span class="detail-value">${formatPct(estProb)}</span>
          </div>
          <div class="detail">
            <span class="detail-label">Edge</span>
            <span class="detail-value ${parseFloat(edgeAbs) > 5 ? 'edge-positive' : ''}">${edge > 0 ? '+' : ''}${edge}%</span>
          </div>
          ` : ''}
          <div class="detail">
            <span class="detail-label">Volume</span>
            <span class="detail-value">${formatMoney(market.volume)}</span>
          </div>
          <div class="detail">
            <span class="detail-label">Liquidity</span>
            <span class="detail-value">${formatMoney(market.liquidity)}</span>
          </div>
          ${market.est_reasoning ? `
          <div class="trade-reasoning">
            <span class="detail-label">Bot Analysis</span>
            <div class="reasoning-text">${esc(market.est_reasoning)}</div>
          </div>
          ` : ''}
        </div>
      </div>
    `;

    card.querySelector('.trade-header').addEventListener('click', () => {
      card.classList.toggle('expanded');
    });

    list.appendChild(card);
  });
}

function updatePhase(botStatus) {
  const badge = document.getElementById('phaseBadge');
  if (!botStatus) return;
  const phase = botStatus.phase || 'learning';
  const mode = botStatus.mode || 'paper';
  const labels = { learning: 'LEARNING', validating: 'VALIDATING', live_trading: 'LIVE' };
  badge.textContent = labels[phase] || phase.toUpperCase();
  badge.className = `phase-badge ${phase}`;

  const modeStr = mode.replace('_', ' ').toUpperCase();
  const botText = document.getElementById('botText');
  if (botText && botText.textContent.includes('BOT')) {
    botText.textContent = botText.textContent + ` · ${modeStr}`;
  }
}

function updateLearning(learning) {
  const bar = document.getElementById('learningBar');
  if (!learning) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';

  const resolved = learning.resolved_trades || 0;
  const target = learning.target_resolved || 100;
  const pct = Math.min(100, Math.round(resolved / target * 100));

  document.getElementById('learningText').textContent = `${resolved}/${target} resolved — ${pct}% to validation`;
  document.getElementById('learningPct').textContent = `${pct}%`;
  document.getElementById('learningFill').style.width = `${pct}%`;
}

function updateExposure(exposure, stats) {
  const row = document.getElementById('exposureRow');
  if (!exposure) { row.innerHTML = ''; return; }

  let html = '';

  html += `<span class="exposure-item">High Edge (≥10%): <span class="val">${exposure.high_edge_count} trades (${formatMoney(exposure.high_edge_deployed)})</span></span>`;
  html += `<span class="exposure-item">Low Edge: <span class="val">${exposure.low_edge_count} trades (${formatMoney(exposure.low_edge_deployed)})</span></span>`;

  if (exposure.by_direction) {
    const yes = exposure.by_direction.yes || {count:0,deployed:0};
    const no = exposure.by_direction.no || {count:0,deployed:0};
    html += `<span class="exposure-item">YES: <span class="val">${yes.count} (${formatMoney(yes.deployed)})</span></span>`;
    html += `<span class="exposure-item">NO: <span class="val">${no.count} (${formatMoney(no.deployed)})</span></span>`;
  }

  if (exposure.by_category) {
    const cats = Object.entries(exposure.by_category).sort((a,b) => b[1].deployed - a[1].deployed).slice(0, 4);
    cats.forEach(([cat, data]) => {
      html += `<span class="exposure-item">${cat}: <span class="val">${data.count} (${formatMoney(data.deployed)})</span></span>`;
    });
  }

  row.innerHTML = html;
}

function updateBacktest(learning) {
  const card = document.getElementById('backtestCard');
  const grid = document.getElementById('backtestGrid');

  if (!learning || !learning.backtest_results) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const bt = learning.backtest_results;
  let html = '';

  const brierClass = bt.brier_score !== null ? (bt.brier_score < 0.25 ? 'good' : 'bad') : '';
  html += `<div class="backtest-stat"><div class="label">Brier</div><div class="value ${brierClass}">${bt.brier_score !== null ? bt.brier_score.toFixed(3) : '--'}</div></div>`;
  html += `<div class="backtest-stat"><div class="label">Mkt Brier</div><div class="value">${bt.market_brier_score !== null ? bt.market_brier_score.toFixed(3) : '--'}</div></div>`;
  html += `<div class="backtest-stat"><div class="label">Skill</div><div class="value ${bt.brier_skill > 0 ? 'good' : 'bad'}">${bt.brier_skill !== null ? bt.brier_skill.toFixed(3) : '--'}</div></div>`;

  if (bt.roi_at_5pct_edge !== null && bt.roi_at_5pct_edge !== undefined) {
    html += `<div class="backtest-stat"><div class="label">ROI ≥5%</div><div class="value ${bt.roi_at_5pct_edge > 0 ? 'good' : 'bad'}">${bt.roi_at_5pct_edge}%</div></div>`;
  }
  if (bt.roi_at_10pct_edge !== null && bt.roi_at_10pct_edge !== undefined) {
    html += `<div class="backtest-stat"><div class="label">ROI ≥10%</div><div class="value ${bt.roi_at_10pct_edge > 0 ? 'good' : 'bad'}">${bt.roi_at_10pct_edge}%</div></div>`;
  }
  if (bt.roi_at_20pct_edge !== null && bt.roi_at_20pct_edge !== undefined) {
    html += `<div class="backtest-stat"><div class="label">ROI ≥20%</div><div class="value ${bt.roi_at_20pct_edge > 0 ? 'good' : 'bad'}">${bt.roi_at_20pct_edge}%</div></div>`;
  }

  grid.innerHTML = html;
}

function updateTimeline(timeline) {
  const section = document.getElementById('timelineSection');
  const items = document.getElementById('timelineItems');

  if (!timeline || timeline.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';

  const now = new Date();
  const soon = new Date(now.getTime() + 48 * 60 * 60 * 1000);

  let html = '';
  timeline.slice(0, 8).forEach(t => {
    const date = new Date(t.date + 'T23:59:59');
    const isSoon = date <= soon;
    html += `<div class="timeline-item ${isSoon ? 'soon' : ''}">${t.date}<span class="tl-count">${t.count}</span></div>`;
  });

  items.innerHTML = html;
}

async function fetchFeed() {
  const dot = document.getElementById('statusDot');
  const update = document.getElementById('lastUpdate');

  try {
    const res = await fetch(FEED_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('Feed not available');
    feedData = await res.json();

    dot.className = 'status-dot';
    const updatedAt = feedData.updated_at ? relativeTime(feedData.updated_at) : 'unknown';
    update.textContent = `Updated ${updatedAt}`;

    updateStrategy(feedData.strategy);
    updateBotStatus(feedData.bot_status);
    updatePhase(feedData.bot_status);
    updateLearning(feedData.learning);

    // Check for multi-strategy format
    isMultiStrategy = feedData.strategies && Array.isArray(feedData.strategies) && feedData.strategies.length > 0;

    if (isMultiStrategy) {
      // Multi-strategy view
      document.getElementById('singleStrategyView').style.display = 'none';
      renderMultiStrategy();
    } else {
      // Single-strategy view (backward compat)
      document.getElementById('strategySections').style.display = 'none';
      document.getElementById('singleStrategyView').style.display = 'block';
      updateExposure(feedData.exposure, feedData.stats);
      updateBacktest(feedData.learning);
      updateTimeline(feedData.resolution_timeline);
      updatePortfolio(feedData.stats);
      renderTrades();
    }
  } catch {
    dot.className = 'status-dot offline';
    update.textContent = 'Feed offline';
    updateBotStatus(null);
    document.getElementById('tradeList').innerHTML =
      '<div class="error-state">Could not load trade feed. Run export_feed.py to generate data.</div>';
  }
}

fetchFeed();
setInterval(fetchFeed, REFRESH_INTERVAL);
</script>
